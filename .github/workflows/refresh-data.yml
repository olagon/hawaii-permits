name: Refresh data
# Monthly automatic re-verification of the data against official sources, done by Claude Code.
# Opens a pull request for a human to review. Needs the ANTHROPIC_API_KEY secret. Skips quietly without it.
on:
  schedule:
    - cron: '0 18 1 * *'
  workflow_dispatch:
    inputs:
      focus:
        description: 'Optional extra instruction, for example "only Kauaʻi" or "recheck hurricane closures"'
        required: false
        default: ''
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY not set. See HUMAN_TODO.md. Skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.key.outputs.ok == 'true'
      - name: Re-verify data with Claude Code
        if: steps.key.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            ${{ github.event.inputs.focus }}
            Follow the instructions in scripts/REFRESH_PROMPT.md exactly.
          claude_args: '--model claude-opus-5 --max-turns 400 --allowedTools "Bash(npm run *),Bash(npm test),Bash(node *),Bash(curl *),Read,Edit,Write,Glob,Grep,WebFetch,WebSearch"'
      - name: Open pull request
        if: steps.key.outputs.ok == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data-refresh
          title: 'Data refresh ${{ github.run_started_at }}'
          commit-message: 'Data refresh: re-verify stale and closed entries'
          body-path: reports/refresh-summary.md
          labels: |
            data
            refresh
          delete-branch: true
