id: kauai-camping-permit
name: Kauaʻi County camping permit
issuer: kauai-parks
category: camping
who_needs: Anyone camping at ʻAnini, Anahola, or Salt Pond beach park. Lydgate has its own permit.
how_to_get: online
url: https://hikauaiweb.myvscloud.com/webtrac/web/
carry_required: true
booking_window:
  notes: Book online. Up to 6 consecutive nights per permit and 60 camping days per calendar year. Each permit covers up to 10 campers. Display the permit on the outside of your tent. Parks close for maintenance one day a week.
cost:
  resident: 0
  nonresident: 3
  unit: per adult per night
  note: Hawaiʻi residents with a state ID and all children under 18 are free. Fees are not refundable.
age_minimum: 18
sources:
  - https://www.kauai.gov/Government/Departments-Agencies/Parks/Permitting/Camping
  - https://www.kauai.gov/files/assets/public/v/3/parks-and-rec/documents/cok-campground-guidelines-and-rules-2023.pdf
last_verified: 2026-09-25
