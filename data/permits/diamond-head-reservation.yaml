id: diamond-head-reservation
name: Diamond Head State Monument entry and parking reservation
issuer: dlnr-state-parks
category: entry_reservation
who_needs: Visitors who are not Hawaiʻi residents. Every nonresident needs a timed entry reservation, and a parking reservation if driving in. Residents enter free with a Hawaiʻi ID but are not guaranteed parking. Visitors who come with a resident still need their own reservation.
how_to_get: online
url: https://gostateparks.hawaii.gov/diamondhead
carry_required: true
covers: [diamond-head-state-monument]
booking_window:
  opens_days_before: 30
  notes: Reservations open 30 days ahead. Time slots start at 6 am and the last slot is 4 pm. Arrive within the first 30 minutes of your slot or you may be turned away. Park closes at 6 pm.
cost:
  resident: 0
  nonresident: 5
  unit: per person, plus $10 per vehicle for parking
  note: Children 3 and under are free.
refund_policy: Refunds up to 3 days before the entry date, with a cancellation fee. No refunds for weather unless the park closes.
sources:
  - https://gostateparks.hawaii.gov/diamondhead/about
  - https://gostateparks.hawaii.gov/diamondhead/faq
  - https://dlnr.hawaii.gov/dsp/parks/oahu/
last_verified: 2026-09-25
