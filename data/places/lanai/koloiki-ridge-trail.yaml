summary: About 5 mile round trip walk from the Kōʻele area above Lānaʻi City up through pines and ironwood to Koloiki Ridge, with views into Maunalei Gulch and across to Molokaʻi and Maui. On private Pūlama Lānaʻi land but used freely by residents and visitors. The route shares a road with resort UTV tours.
