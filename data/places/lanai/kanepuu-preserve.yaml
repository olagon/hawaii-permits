summary: Last big stand of native dryland forest on Lānaʻi, 590 acres in several fenced units on the road to Keahiakawelo. A short self guided interpretive trail with signs and a self closing gate is open sunrise to sunset. The Nature Conservancy manages it on Pūlama Lānaʻi land.
