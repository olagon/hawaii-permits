summary: 12.8 mile one lane dirt road over the spine of Lānaʻi through Cook pines to the 3,370 foot summit of Lānaʻihale, with views of up to five other islands on a clear day. It is on private Pūlama Lānaʻi land. The Hawaiʻi Tourism Authority page says the trail is currently closed for construction and restoration. Check with Pūlama Lānaʻi before planning a hike or drive.
booking: { method: none }
