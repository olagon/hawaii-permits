rules:
  - Closed for restoration work as of this check. Do not drive around barriers.
  - When open, the road is narrow, muddy after rain, and has steep drops. 4 wheel drive only, no driving in wet weather.
  - Map pin is approximate, near the north trailhead above Kōʻele.
