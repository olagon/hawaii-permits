summary: Landowner run axis deer and mouflon hunting on private Pūlama Lānaʻi land, separate from the state lottery hunts in the Cooperative Game Management Area. Hunters pay a base fee plus a daily unit fee for rifle or shotgun zones. Lānaʻi residents pay much less. Contact the hunting office for zones, dates, and check in. Map pin is Lānaʻi City.
