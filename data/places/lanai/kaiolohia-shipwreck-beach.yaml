summary: Long windward beach on the north shore about 30 minutes from Lānaʻi City down the paved Keōmoku Road and then a sandy track. A rusting 1940s tanker sits on the reef offshore. Beachcombing, fishing, and a short marked walk to the Pōʻaiwa petroglyphs. Shallow, rocky, and windy, not for swimming.
booking: { method: none }
