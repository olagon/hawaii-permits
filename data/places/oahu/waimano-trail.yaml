id: waimano-trail
name: Waimano Trail
location:
  lat: 21.417
  lng: -157.951
aliases:
  - Waimano Ridge Trail
  - Upper Waimano Trail
summary: A 7.2 mile trail from the Waimano Home Road gate along an old ditch and up the ridge to the Koʻolau summit. Long and muddy with a shelter partway.
rules:
  - Park at the lot by the guard shack. Start left of the fence.
  - Flash floods on the lower section. Cliffs near the summit.
  - This is an active hunting area. Wear bright colors.
  - No drinking water. Treat all stream water.
