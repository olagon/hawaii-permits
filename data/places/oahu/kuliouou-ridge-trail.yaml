summary: A popular 2.5 mile switchback trail from the end of Kalāʻau Place to a Koʻolau summit lookout over Waimānalo. Two picnic shelters on the way up.
rules:
  - Street parking only. Sign in at the hunter and hiker check in station.
  - Steep stairs near the top. Loose rock and sun exposure.
  - This is an active hunting area. Wear bright colors.
  - No drinking water. Treat all stream water.
