summary: >-
  Closed since a rockfall killed 8 people on Mother's Day 1999. The park stays closed and the state has no plan to reopen it. Entering is trespassing and DLNR officers cite people regularly, with
  fines that grow for repeat offenses.
rules:
  - Closed to all entry. Do not go in.
  - Fines are issued for trespassing.
  - Map pin is approximate.
hazards:
  - falling_rock
  - flash_flood
alerts:
  nws_zone: HIZ035
cultural_notes: Kaliuwaʻa is tied to the pig god Kamapuaʻa.
