summary: A 2.5 mile trail in Pūpūkea Forest Reserve behind the Boy Scout camp at the end of Pūpūkea Road, through gulches and ridges with North Shore views. Open only on weekends and state holidays.
rules:
  - Open weekends and state holidays only.
  - Park in the neighborhood and walk about 0.75 mile down the dirt road to the trailhead.
  - This is an active hunting area. Wear bright colors.
  - No drinking water. Treat all stream water.
