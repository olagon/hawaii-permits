land_type: federal
permits_required:
  - permit: uss-arizona-memorial-ticket
    when: To ride the boat to the USS Arizona Memorial. Tickets release 56 days ahead and 1 day ahead at 3 pm HST on recreation.gov. The visitor center and museums are free without a ticket.
