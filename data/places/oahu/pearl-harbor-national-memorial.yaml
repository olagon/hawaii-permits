summary: The visitor center, museums and boat program to the USS Arizona Memorial, where the ship and her crew rest below the water. Free entry. The boat program needs a timed ticket and fills weeks ahead.
booking:
  method: online
  url: https://www.recreation.gov/ticket/facility/233338
  window_note: Tickets open 56 days ahead at 3 pm HST, with a second release 1 day ahead at 3 pm HST.
fees:
  entry: 0
  parking: 7
  note: Parking is $7 a day, paid by mobile app. The recreation.gov ticket has a $1 fee.
rules:
  - Open 7 am to 5 pm daily. Closed Thanksgiving, Christmas and New Year's Day.
  - No bags, purses or backpacks inside. Bag storage is available near the entrance.
  - Shirts and shoes required. Quiet and respectful behavior on the memorial.
  - The Navy may cancel boats in bad weather.
