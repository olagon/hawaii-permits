permits_required: []
status: open
aliases:
  - Makapuʻu Point Lighthouse Trail
  - Makapuu Lighthouse Trail
  - Kaiwi Coast
summary: Rugged coastline between Sandy Beach and Makapuʻu with the paved 2 mile round trip Makapuʻu Point Lighthouse Trail. Great whale watching from November to May.
fees:
  entry: 0
  parking: 0
rules:
  - Open 7 am to 7:45 pm April 1 through Labor Day, and 7 am to 6:45 pm the rest of the year. The gate closes and cars left inside get locked in.
  - The trail is paved but steep, hot and windy with no shade or water.
  - Parking fills by mid morning. Do not park on the highway.
  - Stay on the trail and off the cliffs.
hazards:
  - heat
  - steep_drop
  - no_water
  - high_surf
alerts:
  nws_zone: HIZ032
amenities:
