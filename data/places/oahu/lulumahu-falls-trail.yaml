name: Lulumahu Falls Trail
location:
  lat: 21.36
  lng: -157.812
aliases:
  - Lulumahu Falls
summary: A muddy 1.5 mile route in upper Nuʻuanu through bamboo to a tall waterfall, inside the Honolulu Forest Reserve restricted watershed. A permit is required and there is no parking.
rules:
  - Permit required. Get dropped off. Parking on the Pali Highway is not allowed.
  - Clean boots before entering to keep out weeds.
  - Flash flood danger in the stream.
  - Forest reserves close during storm warnings.
  - Map pin is approximate.
  - This is an active hunting area. Wear bright colors.
