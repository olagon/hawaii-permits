  lng: -157.9329
aliases:
  - Manana Trail
  - Manana Ridge
summary: A long 6 mile ridge trail from the end of Komo Mai Drive in Pacific Palisades to the Koʻolau summit. The first stretch is a paved road to a water tank, then a forest ridge with shelters.
rules:
  - Park legally in the neighborhood. Walk through the pedestrian gate by the road gate.
  - Narrow ridge with drop offs near the summit. Fire danger when dry.
  - This is an active hunting area. Wear bright colors.
  - No drinking water. Treat all stream water.
