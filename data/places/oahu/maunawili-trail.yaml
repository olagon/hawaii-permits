name: Maunawili Trail
location:
  lat: 21.3693
  lng: -157.7848
aliases:
  - Maunawili Trail
  - Maunawili Falls
summary: >-
  A 10 mile contour trail along the base of the Koʻolau cliffs from the Pali Highway hairpin turn to Waimānalo. Views of Olomana and the windward side. The Maunawili Falls spur is a separate, often
  closed, route.
rules:
  - Park at the hairpin turn lookout on the Pali Highway. Break ins are common.
  - Long trail with many gulches. Bring water.
  - The section from the Pali Lookout was listed as closed. Start at the hairpin turn.
