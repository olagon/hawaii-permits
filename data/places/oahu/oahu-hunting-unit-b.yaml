id: oahu-hunting-unit-b
name: Oʻahu Public Hunting Area Unit B (Mākua-Keaʻau)
land_type: state
manager: dlnr-dofaw
location:
  lat: 21.4989
  lng: -158.2099
activities:
  - hunting
  - hiking
permits_required:
  - permit: hunting-license
    when: To hunt game mammals (pigs and goats) in Unit B. Check the DOFAW Oʻahu hunting page for open days, weapons and check in stations.
  - permit: game-bird-stamp
    when: To hunt game birds in the bird hunting unit that overlaps Unit B during the game bird season.
status: open
summary: Game mammal and game bird hunting in the Mākua-Keaʻau Forest Reserve on the Waiʻanae coast (bird Unit 2). Steep, dry ridges above Mākua and Keaʻau.
rules:
  - Wear blaze orange. Hikers share these areas.
  - Check in and out at the hunter check station where one exists.
  - Unit boundaries change. Print the current map from the DOFAW page.
  - Map pin is the unit centroid from the DOFAW GIS layer.
hazards:
  - hunting_area
  - remote
  - no_water
  - steep_drop
alerts:
  nws_zone: HIZ006
sources:
  - https://dlnr.hawaii.gov/recreation/hunting/oahu/
  - https://hunting.ehawaii.gov/hunting/license.html
island: oahu
last_verified: '2026-09-25'
verified_by: ai_research
