summary: The site of the largest World War II internment and prisoner of war camp in Hawaiʻi, in a gulch above Kunia. No public road reaches it, so the park is closed except for occasional guided tours.
booking:
  method: online
  url: https://www.nps.gov/hono/planyourvisit/index.htm
  window_note: Tours are announced on the park site and fill first come first served.
fees:
  entry: 0
rules:
  - Do not try to reach the site on your own. The surrounding land is private.
  - Exhibits about the camp are at the Pearl Harbor National Memorial bookstore, the Japanese Cultural Center of Hawaiʻi and Hawaiʻi's Plantation Village.
alerts:
