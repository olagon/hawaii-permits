id: popoia-flat-island
name: Popoiʻa Islet Seabird Sanctuary (Flat Island)
island: oahu
land_type: state
manager: dlnr-dofaw
location: { lat: 21.400, lng: -157.721 }
activities: [wildlife_viewing, boating, swimming]
permits_required: []
status: restricted
aliases: [Popoia, Flat Island]
summary: A low islet a short paddle off Kailua Beach. The rocky edge below the high water mark is open in daylight. The interior is a seabird sanctuary and closed.
booking: { method: none }
fees: { entry: 0 }
rules:
  - This is a state seabird sanctuary. You may only use the area below the high water mark, so stay on the beach and rocks at the water's edge.
  - Do not go up into the dunes, grass, or burrow areas. Seabirds nest in burrows that collapse when stepped on.
  - Closed from sunset to sunrise.
  - No fires, dogs, camping, tents, or structures.
  - Do not feed, touch, or chase birds, seals, or turtles.
  - Commercial tour vessels need a DOFAW permit to land.
hazards: [high_surf, remote]
sources:
  - https://dlnr.hawaii.gov/wildlife/sanctuaries/oahuoffshoreislets/
