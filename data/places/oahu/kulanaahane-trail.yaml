id: kulanaahane-trail
name: Kulanaʻahane Trail
location:
  lat: 21.3874
  lng: -157.8494
aliases:
  - Kulanaahane Trail
summary: A 2.75 mile trail that leaves Kamananui Valley Road about 2 miles in and follows the stream to a saddle on the Koʻolau crest with views to Haʻikū Valley. Many stream crossings.
rules:
  - Starts 2 miles up Kamananui Valley Road. Same access rules apply.
  - Flash flood danger. Do not go in heavy rain.
  - The ridge beyond the saddle toward the Haʻikū Stairs is closed.
  - This is an active hunting area. Wear bright colors.
hazards:
  - flash_flood
  - stream_crossings
  - steep_drop
  - hunting_area
  - mud
