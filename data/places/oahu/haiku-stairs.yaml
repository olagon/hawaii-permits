summary: >-
  The old Navy stairway up the Koʻolau above Kāneʻohe has been closed to the public since 1987. The city began taking the stairs down in 2024 and all access is closed while removal and court cases
  continue. Do not attempt it from any side. Trespassers are cited and arrested.
rules:
  - Closed. Entering the site from Haʻikū, Moanalua or any other route is trespassing.
  - Police and DLNR officers patrol and issue citations.
  - Map pin is approximate.
