summary: A short 0.75 mile loop in Nuʻuanu through bamboo and pine, starting at Nuʻuanu Pali Drive. Crosses Nuʻuanu Stream, which floods fast in rain.
rules:
  - Do not cross the stream when it is high.
  - Break ins are common at the trailhead. Leave nothing in the car.
  - This is an active hunting area. Wear bright colors.
