summary: Remote white sand cove on the northwest coast. The beach itself is public, but the only road in crosses Molokaʻi Ranch land leased to a hunting outfitter, and a locked gate now blocks vehicles. Access has been a long running dispute since 1975. Walking in along the coast or arriving by boat are the stated alternatives.
