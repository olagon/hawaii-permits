permits_required:
  - permit: maui-camping-permit
    when: To camp overnight. Apply at the Molokaʻi parks office, 808-553-3204. First come, first served.
status: open
aliases: [Papohaku Beach Park, Papohaku Beach, Kepuhi]
summary: County park on Molokaʻi's west end with one of the longest white sand beaches in Hawaiʻi. Two campsites in a kiawe grove behind the dunes. Big surf and strong currents most of the year, so swim with care or not at all.
booking: { method: in_person, url: https://www.mauicounty.gov/409/Camping-Sites, phone: 808-553-3204, window_note: Pay in cash or money order when you reserve. Fees are not refundable. }
fees: { entry: 0, parking: 0, camping_per_night: see_source, resident_camping_per_night: see_source, note: Residents pay $5 per adult Monday to Thursday and $10 Friday to Sunday and holidays. Nonresidents pay $50 and $100. Minors and licensed dogs are less. }
rules:
  - Park hours are 7 am to 8 pm.
  - Camping is limited to 4 consecutive nights. Each site holds up to 6 campers.
  - Bring a tent. Weather comes in fast on the west end.
  - No lifeguard. Offshore currents are strong.
hazards: [high_surf, heat]
