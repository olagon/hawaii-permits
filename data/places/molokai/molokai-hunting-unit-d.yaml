summary: Public hunting unit in the Molokaʻi Forest Reserve. State lands of Makakupaʻia West, Kalamaʻula, Kahanui, and Kaunakakai south of the Maunahui road and along the Kamakou Preserve fence. Game mammals and game birds. Check the DLNR Molokaʻi hunting page for the current season, bag limits, and check station rules before you go. Map pin is the unit centroid.
