summary: About 1,700 acres of remote northwest coast, dunes, and seasonal wetland held by the Molokaʻi Land Trust. Access is through a pass system for Molokaʻi residents for subsistence fishing, gathering, and deer hunting, plus scheduled volunteer work days that anyone can sign up for. Not open for casual visits.
