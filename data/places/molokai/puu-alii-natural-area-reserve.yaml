summary: Natural area reserve of wet native forest and bog on the north rim of east Molokaʻi, next to The Nature Conservancy's Kamakou Preserve. A rough foot trail links it to Kamakou, but there are no facilities and interior access is by helicopter. Go only with TNC or DOFAW guidance.
booking: { method: none }
