summary: Coastal dune preserve on the windy northwest shore, one of the last intact dune ecosystems in the main islands, with rare plants, nesting green sea turtles, and a growing shearwater colony. Access is limited. Contact The Nature Conservancy before visiting. TNC staff and volunteers lead a monthly hike.
