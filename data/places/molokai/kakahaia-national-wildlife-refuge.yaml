summary: Small wetland refuge on the south shore east of Kaunakakai, set up in 1976 for endangered aeʻo (Hawaiian stilt) and ʻalae keʻokeʻo (Hawaiian coot). The pond and marsh are not open for walk in visits. Volunteer work days are arranged on request. The county beach park across the road gives a view of the refuge.
booking: { method: phone, url: https://www.fws.gov/refuge/kakahaia, phone: 808-875-1582, window_note: Managed from the Maui refuge complex in Kīhei. Call to ask about volunteer days. }
