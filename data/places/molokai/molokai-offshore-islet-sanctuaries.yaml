summary: Six state seabird sanctuary islets off Molokaʻi, Mokuhoʻoniki and Kanahā Rock off the east end and ʻŌkala, Mokapu, Huelo, and Mokumanu along the north shore. All are closed to landing under the wildlife sanctuary rules. Look from a boat, do not go ashore. Map pin is Mokuhoʻoniki.
