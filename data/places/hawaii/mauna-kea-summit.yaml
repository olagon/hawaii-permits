rules: ["Stop at least 30 minutes at the Visitor Information Station to acclimatize before going higher.", "Only dependable 4WD or AWD vehicles above the VIS. No 2WD.", "Do not go above the VIS if you are pregnant, under 13, have heart or breathing problems, or have scuba dived in the last 24 hours.", "Summit access is closed from 30 minutes after sunset to 30 minutes before sunrise.", "Vehicles must be clean of mud and invasive species.", "Expect freezing temperatures, snow, and winds over 100 mph any month.", "The VIS was closed through September 26, 2026 for Hurricane Nolo, and the Humuʻula summit trail is closed with no reopening date."]
