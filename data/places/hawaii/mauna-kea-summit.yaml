summary: "The 13,803 foot summit of Maunakea, reached by the Maunakea Access Road from Saddle Road. The Visitor Information Station at 9,200 feet is open 9am to 9pm. Above it the road is steep gravel and only 4WD or AWD vehicles may go up. The summit is closed 30 minutes after sunset to 30 minutes before sunrise. The University of Hawaiʻi manages the science reserve under state rules."
