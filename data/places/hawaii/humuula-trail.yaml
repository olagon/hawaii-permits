summary: "The historic 5.5 mile route on the Hilo Forest Reserve side of Mauna Kea near Kaula Gulch. Nā Ala Hele lists it as private access, needing permission from the landowner (formerly Hamakua Sugar). Hunters and rough footing. Not the same as the summit trail from the Visitor Information Station, which the Center for Maunakea Stewardship closed after Hurricane Nolo in September 2026."
