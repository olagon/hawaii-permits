aliases: [Waiopae Tidepools, Kapoho Tide Pools, Wai Opae]
summary: The Kapoho tidepools in lower Puna were a popular snorkel spot and a marine conservation district from 2003. The 2018 Kīlauea eruption buried the tidepools and the nearby homes under lava. The place no longer exists.
booking: { method: none }
rules:
  - The tidepools were covered by lava in June 2018. There is nothing to visit.
  - The new coastline is unstable and much of the area is private land. Do not try to reach the old site.
  - Map pin is approximate.
hazards: [falling_rock, heat]
