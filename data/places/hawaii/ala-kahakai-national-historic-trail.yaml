summary: "A 175 mile corridor of ancient coastal trails from ʻUpolu Point around South Point to the national park. Only parts are open, mainly through the four national park units, state parks, and the state Nā Ala Hele sectors between Kawaihae and ʻAnaehoʻomalu. Much of the rest crosses private land."
