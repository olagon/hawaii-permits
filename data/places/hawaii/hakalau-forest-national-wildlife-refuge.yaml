summary: "High elevation koa and ʻōhiʻa forest on the windward slope of Mauna Kea, home to endangered forest birds. Closed to self guided visits because of Rapid ʻŌhiʻa Death. The only public access is with one of the licensed guide companies that hold special use permits for the Pua ʻĀkala unit, or on scheduled volunteer days."
