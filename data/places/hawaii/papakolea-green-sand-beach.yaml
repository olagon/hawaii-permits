summary: "Olivine beach in Kaʻū near South Point on Hawaiian Home Lands. Reach it on foot only, about 2.5 miles each way from the parking area over hot, windy, exposed ground. The landowner does not allow vehicles on the road to the beach and does not sell vehicle permits. People selling truck rides from the lot are operating illegally and have damaged the land."
