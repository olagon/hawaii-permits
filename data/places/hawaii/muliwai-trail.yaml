summary: "The 9 mile trail from the west side of Waipiʻo Valley over the cliffs to Waimanu Valley, with camping at Waimanu by DOFAW permit. Cliffs, flash floods, shore break, and slippery rock. A landslide past Helipad 1 has closed the trail and campground, and the Waipiʻo road is closed to visitors on foot or in cars."
