summary: "The lookout at the end of Highway 240 is open. Waipiʻo Valley Road below it has been closed to visitors since February 2022 by county emergency rule because of rockfall and slope failure. Only Hawaiʻi County residents, permitted tour operators, and Native Hawaiians exercising traditional rights may drive down, in low range 4WD. Walking, ATVs, and horses on the road are banned."
