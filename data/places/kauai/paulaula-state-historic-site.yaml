summary: "Stone fort walls at the mouth of the Waimea River, also called Russian Fort Elizabeth, on the site of the earlier Hawaiian fort Pāʻulaʻula. Short walk with signs. Closed after Hurricane Lowell."
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says its Kauaʻi lands stay closed until they are safe. Check the DLNR page before you go.
  - Stay off the walls.
