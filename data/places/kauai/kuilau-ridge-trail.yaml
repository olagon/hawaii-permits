id: kuilau-ridge-trail
name: Kuilau Ridge Trail
island: kauai
land_type: state
manager: dlnr-dofaw
location:
  lat: 22.0713
  lng: -159.4164
activities: [hiking, biking, hunting]
permits_required:
  - permit: hunting-license
    when: Only if you are hunting. Hikers do not need it. Hunting dogs may be off leash; keep your own dog leashed.
status: closed
aliases: [Kuilau Trail]
summary: "The trail starts on Highway 580 about 100 yards before the Keahua Forestry Arboretum. It is a very scenic route through the Lihue-Koloa Forest Reserve that ends at the Moalepe Trail. This trail, combined with the Moalepe Trail, is a popular equestrian route. The total length from its start to the start of the Moalepe Trail at Olohena Road is 4.25 miles. About 2.1 miles one way."
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says Nā Ala Hele trails on Kauaʻi stay closed until they are safe. Check hawaiitrails.hawaii.gov before you go.
  - Hunting may be in progress. Wear bright colors and keep dogs leashed.
  - Commercial use needs a Nā Ala Hele permit. Stay on the marked trail; side routes may cross private land.
hazards: [hunting_area]
alerts:
  nws_zone: HIZ030
amenities: [restroom, bridge, parking, picnic table, shelter]
