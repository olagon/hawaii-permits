id: kauai-hunting-unit-a
name: Kauaʻi Hunting Unit A
island: kauai
land_type: state
manager: dlnr-dofaw
location:
  lat: 22.0567
  lng: -159.711
activities: [hunting]
permits_required:
  - permit: hunting-license
    when: "Required to hunt in Unit A. Check the current season, bag limits, and check station rules for this unit in the DOFAW Kauaʻi hunting rules before you go."
  - permit: game-bird-stamp
    when: Required during game bird season in addition to the hunting license.
status: closed
aliases: [Unit A, Kekaha Game Management Area]
summary: Puʻu Ka Pele Forest Reserve west of the Contour Road plus the Kekaha Game Management Area on the dry west slopes above Kekaha and Mānā. Mammal and bird hunting.
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR reopened only Unit F so far. Check the DOFAW Kauaʻi hunting page before you go.
  - Public hunting area. Non hunters should wear bright colors and keep dogs leashed.
  - Kekaha GMA is on Hawaiian Home Lands under lease to DOFAW. Black tailed deer hunts are by lottery or archery permit from the Līhuʻe DOFAW office.
hazards: [hunting_area, steep_drop, remote, flash_flood]
alerts:
  nws_zone: HIZ003
sources:
