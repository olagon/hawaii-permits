id: makaha-arboretum-road
name: Mākaha Arboretum Road
island: kauai
land_type: state
manager: dlnr-dofaw
location:
  lat: 22.1221
  lng: -159.7117
activities: [hiking, four_wheel_drive, hunting]
permits_required:
  - permit: hunting-license
    when: Only if you are hunting. Hikers do not need it. Hunting dogs may be off leash; keep your own dog leashed.
status: closed
aliases: [Makaha Arboretum Trail]
summary: "Take the left road for about a mile to reach the Arboretum, which is located within Puu ka Pele Forest Reserve. A shelter and picnic area is located at this site. The Makaha Arboretum was established in the 1960s as a demonstration forest for windbreak plant species. The Arboretum sustained major damage by hurricane Iwa and Iniki and also by a wildfire in 2000. Today they are still a few original eucalyptus and pine species that were planted in the 1960s. This road provides access to hunting Unit H. About 1.0 miles one way."
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says Nā Ala Hele trails on Kauaʻi stay closed until they are safe. Check hawaiitrails.hawaii.gov before you go.
  - Hunting may be in progress. Wear bright colors and keep dogs leashed.
  - Commercial use needs a Nā Ala Hele permit. Stay on the marked trail; side routes may cross private land.
hazards: [hunting_area, steep_drop]
alerts:
  nws_zone: HIZ004
amenities: [restroom, picnic table, shelter]
