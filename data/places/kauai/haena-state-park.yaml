id: haena-state-park
name: Hāʻena State Park
island: kauai
land_type: state
manager: dlnr-state-parks
location:
  lat: 22.2161
  lng: -159.586
activities: [day_use, swimming, snorkeling, hiking, cultural_visit]
permits_required:
  - permit: haena-state-park-reservation
    when: Every visit. Book entry plus shuttle or parking at gohaena.com. Residents reserve too but pay nothing. Nāpali camping permit holders are exempt.
status: closed
aliases: [Haena State Park, Kee Beach, Kēʻē Beach]
summary: "North shore park at the end of the road with Kēʻē Beach, restored loʻi kalo, and the start of the Kalalau Trail. Entry is by advance reservation with a shuttle or limited parking. Closed after Hurricane Lowell."
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says its Kauaʻi lands stay closed until they are safe. Check the DLNR page before you go.
  - "Nonresidents need a reservation to enter. Self parking is very limited, so most visitors take the shuttle from Waipā or Princeville."
  - Day hikers may go 2 miles to Hanakāpīʻai with this reservation. Going farther needs a Nāpali Coast camping permit.
hazards: [high_surf, flash_flood, stream_crossings]
alerts:
  nws_zone: HIZ029
amenities: [restrooms, showers, parking by reservation, shuttle]
cultural_notes: The park holds Kēʻē and the restored Hāʻena loʻi and other cultural sites. Stay on marked paths and out of walled areas.
