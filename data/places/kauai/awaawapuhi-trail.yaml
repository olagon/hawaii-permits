id: awaawapuhi-trail
name: Awaʻawapuhi Trail
island: kauai
land_type: state
manager: dlnr-dofaw
location:
  lat: 22.1532
  lng: -159.6804
activities: [hiking, hunting]
permits_required:
  - permit: hunting-license
    when: Only if you are hunting. Hikers do not need it. Hunting dogs may be off leash; keep your own dog leashed.
status: closed
aliases: [Awaawapuhi Trail]
summary: "The trail starts at a parking area near the highway 17 mile marker. The Na Pali-Kona Forest Reserve area is managed as wilderness because of the rich variety of native dryland plant species thriving in it (a plant guide is available). The trail ends abruptly on the ridge top, at 2,500 ft. elevation, affording spectacular views down sheer palis (cliffs) into Awaawapuhi and Nualolo Valleys overlooking the Pacific Ocean. The grassy area at the end of the trail provides an excellent place to picnic. About 3.1 miles one way."
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says Nā Ala Hele trails on Kauaʻi stay closed until they are safe. Check hawaiitrails.hawaii.gov before you go.
  - Hunting may be in progress. Wear bright colors and keep dogs leashed.
  - Commercial use needs a Nā Ala Hele permit. Stay on the marked trail; side routes may cross private land.
hazards: [falling_rock, hunting_area, steep_drop]
alerts:
  nws_zone: HIZ004
