aliases: [Wailua River, Opaekaa Falls, Wailua Falls, Fern Grotto, Secret Falls, Uluwehi Falls]
summary: "River, lookouts, and heiau along the Wailua River including ʻŌpaekaʻa Falls, Wailua Falls, the Fern Grotto, and Poliʻahu. After Hurricane Lowell the river and the kayak landing reopened on September 21, 2026, but hiking past the trailhead and Uluwehi (Secret) Falls stay closed."
rules:
  - "Most of the park reopened on September 21, 2026 for boats and kayaks only. Hiking past the trailhead is prohibited and Uluwehi (Secret) Falls is closed until further notice."
  - Kayakers may not enter the Fern Grotto landing while tour boats are there. Use the designated landing zone.
  - Kayak rentals are by licensed vendors; the river is closed to commercial kayaks on Sundays. See the DLNR page.
  - Do not climb into the falls or the heiau walls.
hazards: [flash_flood, stream_crossings, steep_drop, mud]
alerts:
  nws_zone: HIZ030
amenities: [restrooms at lookouts, boat ramp, parking]
cultural_notes: "The Wailua complex holds several heiau, a birthing stone site, and petroglyphs. These are living cultural sites. Do not enter walled areas."
