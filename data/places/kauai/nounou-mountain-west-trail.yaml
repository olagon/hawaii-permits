aliases: [Nounou West Trail, Sleeping Giant]
summary: "The trail begins along Kamalu Road (State Highway 581) in the Wailua Homesteads at telephone pole #11. It starts along a right-of-way, and then climbs up the mountain to join with the East Side Trail. The trail is routed through the Nonou Forest Reserve and timber plantations from the 1930s - it is quite steep. About 1.5 miles one way."
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says Nā Ala Hele trails on Kauaʻi stay closed until they are safe. Check hawaiitrails.hawaii.gov before you go.
  - Commercial use needs a Nā Ala Hele permit. Stay on the marked trail; side routes may cross private land.
