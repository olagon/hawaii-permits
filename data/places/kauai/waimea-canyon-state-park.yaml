summary: The canyon lookouts and trailheads along Waimea Canyon Drive and Kōkeʻe Road. Nonresidents pay entry and parking at the lookouts when open. Closed after Hurricane Lowell with the road above the lower junction closed.
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says its Kauaʻi lands stay closed until they are safe. Check the DLNR page before you go.
  - Kōkeʻe Road and the upper Waimea Canyon Drive are closed with a roadblock.
  - Nonresident entry and parking fees apply at the lookouts when open. See the DLNR page for current amounts.
