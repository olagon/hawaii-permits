  lat: 22.0612
  lng: -159.3549
activities: [hiking]
permits_required: []
status: closed
aliases: [Nounou East Trail, Sleeping Giant Trail]
summary: "The trail starts at a parking area adjacent to the Department of Water pump site beside Haleilio road in Wailua Houselots. The trail ends at a picnic shelter on the \"chest\" of the Sleeping Giant in Nonou Forest Reserve, where there are vistas of the ocean coastline, as well as inland to the Wailua River and Mount Waialeale. The west side trail joins this trail near the 1.5 mile post. About 2.0 miles one way."
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says Nā Ala Hele trails on Kauaʻi stay closed until they are safe. Check hawaiitrails.hawaii.gov before you go.
  - Commercial use needs a Nā Ala Hele permit. Stay on the marked trail; side routes may cross private land.
