location:
  lat: 22.1741
  lng: -159.6571
activities: [camping, swimming]
permits_required:
  - permit: napali-coast-camping-permit
    when: "Every night, per person. 5 nights max in the park."
status: closed
aliases: [Kalalau Valley camp]
summary: "Backcountry camp at the end of the Kalalau Trail, 11 miles from Kēʻē. Composting toilets, a waterfall for water, and no other services. Closed after Hurricane Lowell."
booking:
  method: online
  url: "https://explore.ehawaii.gov/"
  window_note: "90 days ahead. Closed until further notice."
fees:
  camping_per_night: 35
