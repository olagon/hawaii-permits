rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says its Kauaʻi lands stay closed until they are safe. Check the DLNR page before you go.
  - Camp only in the marked beach camping area. The valley interior is closed to camping.
  - No fires. Treat all water. Pack out trash.
hazards: [high_surf, falling_rock, flash_flood, remote, no_water]
alerts:
  nws_zone: HIZ029
amenities: [composting toilets]
max_stay_nights: 5
