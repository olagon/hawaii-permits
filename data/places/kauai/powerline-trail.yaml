id: powerline-trail
name: Powerline Trail
island: kauai
land_type: state
manager: dlnr-dofaw
location:
  lat: 22.1864
  lng: -159.4569
activities: [hiking, biking, hunting]
permits_required:
  - permit: hunting-license
    when: Only if you are hunting. Hikers do not need it. Hunting dogs may be off leash; keep your own dog leashed.
status: closed
summary: "The trail starts at Kapaka Street, up the road from Princeville Stables. It follows a 13 mile electric transmission line maintenance route along the eastern edge of Halelea Forest Reserve, ending near the Keahua Forestry Arboretum in Lihue-Koloa Forest Reserve. This is a dry-weather, all day hike. It is not for motor vehicle travel beyond the paved road. Note: Access from the southern end is possible from the Keahua Forestry Arboretum. The trail system is NOT maintained. About 11.2 miles one way."
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says Nā Ala Hele trails on Kauaʻi stay closed until they are safe. Check hawaiitrails.hawaii.gov before you go.
  - Hunting may be in progress. Wear bright colors and keep dogs leashed.
  - Commercial use needs a Nā Ala Hele permit. Stay on the marked trail; side routes may cross private land.
hazards: [hunting_area]
alerts:
  nws_zone: HIZ030
