aliases: [Camp Sloggett, Sloggett Lodge]
summary: "Historic 1925 family camp in Kōkeʻe State Park run by the YWCA of Kauaʻi. Rents a lodge, a bunkhouse, a studio, and a cottage, mostly on weekends. Tent camping is no longer offered. The YWCA is assessing Hurricane Lowell damage and Kōkeʻe Road is closed."
booking:
  method: owner_direct
  url: "https://www.ywcakauai.org/camp-sloggett"
  phone: "808-245-5959"
fees:
  note: "Studio $80, cottage $165, bunkhouse half $215, lodge $265, whole grounds $900 per night when checked, plus a $100 refundable deposit per building."
rules:
  - No weekends available until 2027 per the YWCA site. Kōkeʻe Road is closed to the public after Hurricane Lowell.
  - Tent camping is no longer available.
  - "Bring your own linens, towels, pillows, and food."
  - Map pin is approximate.
hazards: [cold, mud]
