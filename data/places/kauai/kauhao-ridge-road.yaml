id: kauhao-ridge-road
name: Kauhao Ridge Road
island: kauai
land_type: state
manager: dlnr-dofaw
location:
  lat: 22.1046
  lng: -159.6752
activities: [hiking, biking, four_wheel_drive, hunting]
permits_required:
  - permit: hunting-license
    when: Only if you are hunting. Hikers do not need it. Hunting dogs may be off leash; keep your own dog leashed.
status: closed
summary: "This road provides access to the Boy Scouts of America Kokee Camp, Hunting Unit \"A\" and \"J\" and the Contour Road. It passes from Waimea Canyon State Park, touches the southern part of the makai section of Na Pali-Kona Forest Reserve and finally leads into Puu ka Pele Forest Reserve. About 5.0 miles one way."
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says Nā Ala Hele trails on Kauaʻi stay closed until they are safe. Check hawaiitrails.hawaii.gov before you go.
  - Hunting may be in progress. Wear bright colors and keep dogs leashed.
  - Commercial use needs a Nā Ala Hele permit. Stay on the marked trail; side routes may cross private land.
hazards: [falling_rock, hunting_area, steep_drop]
alerts:
  nws_zone: HIZ004
