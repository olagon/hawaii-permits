id: kauai-hunting-unit-f
name: Kauaʻi Hunting Unit F
island: kauai
land_type: state
manager: dlnr-dofaw
location:
  lat: 22.012
  lng: -159.6585
activities: [hunting]
permits_required:
  - permit: hunting-license
    when: "Required to hunt in Unit F. Check the current season, bag limits, and check station rules for this unit in the DOFAW Kauaʻi hunting rules before you go."
  - permit: game-bird-stamp
    when: Required during game bird season in addition to the hunting license.
status: open
aliases: [Unit F]
summary: Mokihana Ridge and state lands in lower Waimea Canyon reached from the canyon bottom. Mammal and bird hunting. This was the first unit DLNR reopened after Hurricane Lowell.
rules:
  - "Reopened September 21, 2026 for access from the canyon bottom only. Sign in at the check station below the hunter check station. Many storm hazards remain."
  - Public hunting area. Non hunters should wear bright colors and keep dogs leashed.
hazards: [hunting_area, steep_drop, remote, flash_flood]
