summary: The trail starts approximately ? mile beyond Opaekaa Falls on Kuamoo Road (Highway 580) and connects with the Nounou Mt. (West Side) Trail. It is routed laterally along the west side of Nounou Forest Reserve through groves of trees planted in the 1930s by the Civilian Conservation Corps. About 2.0 miles one way.
rules:
  - Listed as closed on the Nā Ala Hele site before the hurricane.
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says Nā Ala Hele trails on Kauaʻi stay closed until they are safe. Check hawaiitrails.hawaii.gov before you go.
  - Commercial use needs a Nā Ala Hele permit. Stay on the marked trail; side routes may cross private land.
