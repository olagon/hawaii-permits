id: kohua-ridge-trail
name: Kohua Ridge Trail
island: kauai
land_type: state
manager: dlnr-dofaw
location:
  lat: 22.0954
  lng: -159.6334
activities: [hiking, fishing, hunting]
permits_required:
  - permit: hunting-license
    when: Only if you are hunting. Hikers do not need it. Hunting dogs may be off leash; keep your own dog leashed.
status: closed
summary: This trail starts approximately 2 miles beyond the Na Pali-Kona Forest Reserve entrance sign on the Mohihi-Camp 10 Road. It serves primarily as a hunter access route for pig and goat hunting but also provides views of Waimea Canyon and dryland koa forest. About 2.5 miles one way.
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says Nā Ala Hele trails on Kauaʻi stay closed until they are safe. Check hawaiitrails.hawaii.gov before you go.
  - Hunting may be in progress. Wear bright colors and keep dogs leashed.
  - Commercial use needs a Nā Ala Hele permit. Stay on the marked trail; side routes may cross private land.
hazards: [flash_flood, hunting_area, steep_drop]
alerts:
  nws_zone: HIZ004
