aliases: [Queens Bath]
summary: "Lava rock tide pool below Princeville. Many people have drowned here when swells wash over the shelf. The county Ocean Safety Bureau locks the access gate whenever surf is up, and the gate is often locked all winter."
rules:
  - "When the gate is locked, entry is trespassing and you can be cited and billed for rescue."
  - Never turn your back on the ocean. Stay off the shelf when waves reach it.
  - Check the county ocean safety notices before going.
  - Map pin is approximate.
