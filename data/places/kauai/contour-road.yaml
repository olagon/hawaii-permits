id: contour-road
name: Contour Road
island: kauai
land_type: state
manager: dlnr-dofaw
location:
  lat: 22.0746
  lng: -159.6795
activities: [hiking, biking, four_wheel_drive, hunting]
permits_required:
  - permit: hunting-license
    when: Only if you are hunting. Hikers do not need it. Hunting dogs may be off leash; keep your own dog leashed.
status: closed
summary: "This road provides access to Hunting Unit \"A\" and \"J\", Lapa Picnic Area, Haeleele Ridge Road, Polihale Ridge Road, Kaaweki Ridge Road and Kauhao Ridge Road. The Contour Road was developed in the mid 1980s as a firebreak road. After hurricane Iniki in 1992, major renovations were done to widen the road because of threats of wildfires to the western slopes of Kokee. This road lies mostly within Puu ka Pele Forest Reserve, entering Na Pali-Kona Forest Reserve at its northern end. About 6.3 miles one way."
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says Nā Ala Hele trails on Kauaʻi stay closed until they are safe. Check hawaiitrails.hawaii.gov before you go.
  - Hunting may be in progress. Wear bright colors and keep dogs leashed.
  - Commercial use needs a Nā Ala Hele permit. Stay on the marked trail; side routes may cross private land.
hazards: [hunting_area]
