summary: The Wailua Forest Management Road starts at the Keahua Arboretum and ends at the gate at Waikoko. The road crosses the Wailua River North Fork and continues past Hanahanapuni. The road is an access to hunting unit C and the Lihue-Koloa Forest Reserve. About 3.0 miles one way.
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says Nā Ala Hele trails on Kauaʻi stay closed until they are safe. Check hawaiitrails.hawaii.gov before you go.
  - Commercial use needs a Nā Ala Hele permit. Stay on the marked trail; side routes may cross private land.
