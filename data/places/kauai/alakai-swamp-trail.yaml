id: alakai-swamp-trail
name: Alakaʻi Swamp Trail
island: kauai
land_type: state
manager: dlnr-dofaw
location:
  lat: 22.1557
  lng: -159.594
activities: [hiking, hunting]
permits_required:
  - permit: hunting-license
    when: Only if you are hunting. Hikers do not need it. Hunting dogs may be off leash; keep your own dog leashed.
status: closed
aliases: [Alakai Swamp Trail]
summary: "The trail starts at a parking and turnaround area 1/4 mile north of the Na Pali-Kona Forest Reserve entrance sign. This trail leads across the Alakai Swamp through scrub, native rain forest and shallow bogs along the boundary between the Alakai Wilderness Preserve (a part of Na Pali-Kona Forest Reserve) and Hono o Na Pali Natural Area Reserve. There are excellent opportunities for birding and botanizing. It ends at a vista called \"Kilohana\" on the edge of Wainiha Pali. On a clear day, the views of Wainiha and Hanalei Valleys provide for an unforgettable experience. About 3.5 miles one way."
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says Nā Ala Hele trails on Kauaʻi stay closed until they are safe. Check hawaiitrails.hawaii.gov before you go.
  - Hunting may be in progress. Wear bright colors and keep dogs leashed.
  - Commercial use needs a Nā Ala Hele permit. Stay on the marked trail; side routes may cross private land.
hazards: [cold, flash_flood, hunting_area, mud, steep_drop]
alerts:
  nws_zone: HIZ004
amenities: [restroom, parking, picnic table, shelter]
