id: iliau-nature-loop
name: Iliau Nature Loop
island: kauai
land_type: state
manager: dlnr-dofaw
location:
  lat: 22.0517
  lng: -159.6601
activities: [hiking, hunting]
permits_required:
  - permit: hunting-license
    when: Only if you are hunting. Hikers do not need it. Hunting dogs may be off leash; keep your own dog leashed.
status: closed
summary: "Located at the start of the Kukui Trail, this is a short roadside loop trail on the western edge of Waimea Canyon. Native upland scrub vegetation plants are identified. The trail also affords excellent vistas of Waimea and Waialae Canyons. Excellent nature trail. About 0.3 miles one way."
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says Nā Ala Hele trails on Kauaʻi stay closed until they are safe. Check hawaiitrails.hawaii.gov before you go.
  - Hunting may be in progress. Wear bright colors and keep dogs leashed.
  - Commercial use needs a Nā Ala Hele permit. Stay on the marked trail; side routes may cross private land.
hazards: [steep_drop]
alerts:
  nws_zone: HIZ004
amenities: [parking, picnic table, shelter]
