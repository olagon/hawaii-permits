summary: Nāpali Coast State Wilderness Park valleys and the upper Hono O Nā Pali Natural Area Reserve. Mammal hunting only. Reached on foot by the Kalalau Trail or by boat.
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR reopened only Unit F so far. Check the DOFAW Kauaʻi hunting page before you go.
  - Public hunting area. Non hunters should wear bright colors and keep dogs leashed.
  - Kalalau Trail access needs the Nāpali Coast camping permit past Hanakāpīʻai.
