summary: "This road provides access to Hunting Unit \"A\" and \"J\", Contour Road and Lapa Picnic Area. This road also leads to Pua Lua Reservoir which is used for the Kokee Rainbow Trout Fishing Season which starts the first Saturday in August and continues for a period of 16 consecutive days, than only on weekends and holidays for the remainder of August and September, unless suspended. The road passes from Waimea Canyon State Park into the Puu ka Pele Forest Reserve. About 6.5 miles one way."
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says Nā Ala Hele trails on Kauaʻi stay closed until they are safe. Check hawaiitrails.hawaii.gov before you go.
  - Commercial use needs a Nā Ala Hele permit. Stay on the marked trail; side routes may cross private land.
