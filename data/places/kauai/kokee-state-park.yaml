  lng: -159.6572
activities: [hiking, camping, day_use, wildlife_viewing, scenic_drive, stargazing]
permits_required:
  - permit: state-parks-camping-permit
    when: To camp at the Kōkeʻe campground. Book 90 days ahead on explore.ehawaii.gov. Camping is closed until further notice.
status: closed
aliases: [Kokee State Park, Kokee]
summary: "Mountain park above Waimea Canyon at about 3,600 feet with a campground, a lodge, cabins, and many Nā Ala Hele trails into the Alakaʻi. Kōkeʻe Road and the whole park are closed after Hurricane Lowell with heavy tree fall."
rules:
  - Closed since Hurricane Lowell hit Kauaʻi in September 2026. DLNR says its Kauaʻi lands stay closed until they are safe. Check the DLNR page before you go.
  - Kōkeʻe Road is closed with a 24 hour roadblock at the Waimea Canyon Road junction. Only people with a legitimate need may pass in daytime.
  - Nonresidents pay an entry and parking fee when the park is open; see the DLNR page.
