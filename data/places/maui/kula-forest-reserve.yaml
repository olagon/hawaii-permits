rules:
  - "Only street legal 4WD vehicles past the forest reserve gate at Kanahau (yellow) gate."
  - "Hunters use the reserve. Wear bright colors."
  - "No camping outside Polipoli SRA."
  - "Nights are cold and fog is common. Winter nights drop below freezing."
  - "Roads and trails close after storms. Check the DLNR page."
