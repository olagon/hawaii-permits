    when: "Only for the Polipoli Spring SRA campground inside the reserve, when it reopens."
  - permit: "hunting-license"
    when: "To hunt game mammals or birds. This is hunting unit C, with unit E archery only near Polipoli."
status: "open"
summary: "Cool planted forest of redwoods, cypress, and pine on the west slope of Haleakalā above Kula, with about a dozen linked Nā Ala Hele trails. Camping is at Polipoli Spring SRA inside the reserve, currently closed. Waipoli (Polipoli) Access Road crosses private land, and only street legal 4x4 vehicles may go past the reserve gate."
