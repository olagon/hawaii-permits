  - "No wood collecting. Bring charcoal or a contained stove."
  - "No pets. Quiet hours 10:00 pm to 8:00 am."
  - "Hammocks only on trees over 10 inches across, padded, 2 straps per tree."
  - "Map pin is approximate."
