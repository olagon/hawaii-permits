rules:
  - "Day use only. Start early for parking and views."
  - "Steep, slick concrete ramp at the start and mud higher up."
  - "Stay on the trail. Steep drop offs on both sides."
  - "No trespassing on Camp Maluhia or ranch land beside the road."
  - "About 2.5 miles. Check the Nā Ala Hele trail page for current conditions and closures."
