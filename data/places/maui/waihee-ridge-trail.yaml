summary: "Steep 2.5 mile climb up a West Maui ridge from Kahekili Highway near Camp Maluhia to a 2,563 foot lookout over Waiheʻe Valley and Makamakaʻole Falls. Often muddy and cloudy. Very popular, parking fills early."
