summary: "Lava coast and reef south of Mākena, the state's first natural area reserve. The northern shoreline near the road is open during posted hours, about 5:30 am to 7:30 pm. The southern interior, the anchialine pools, and other marked areas are closed. Follow the DLNR activity map and signs."
aliases:
