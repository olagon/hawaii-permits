  - "Dumps"
  - "La Perouse Bay"
fees:
  parking: "see_source"
  note: "DLNR lists a paid day use parking lot. Check the reserve page for the current fee."
rules:
  - "Open only during posted hours. Closed areas are marked, stay out of them."
  - "All access to the anchialine pools is closed."
  - "No fishing or taking of anything in the reserve."
  - "Do not stand on or touch coral. Use reef safe sunscreen."
  - "No dogs in most of the reserve. Check the activity map."
  - "Stay on the paved road and marked trails. The lava is sharp and hot."
hazards:
  - "heat"
  - "high_surf"
  - "no_water"
