summary: "Wetland in Kahului that shelters the aeʻo (Hawaiian stilt) and ʻalae keʻokeʻo (coot). Public access is limited to a paved path to a viewing shelter from the Keolani Place lot, a viewing kiosk on Old Haleakalā Highway, and, from August 31 to March 31 only, trails from the Amala Place gates. All open sunrise to sunset."
