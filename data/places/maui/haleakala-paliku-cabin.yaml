id: "haleakala-paliku-cabin"
name: "Palikū Wilderness Cabin"
island: "maui"
land_type: "federal"
manager: "nps"
location:
  lat: 20.724
  lng: -156.133
activities:
  - "cabin"
  - "hiking"
permits_required:
  - permit: "haleakala-wilderness-cabin-reservation"
    when: "To stay in the cabin. Up to 3 nights."
  - permit: "haleakala-entrance-pass"
    when: "Every vehicle entering the park."
status: "open"
summary: "Historic 12 bunk cabin at 6,380 feet at the wet east end of the crater under the Palikū cliffs, 9.3 miles from the Keoneheʻeheʻe trailhead. $75 per night on recreation.gov up to 6 months ahead. A tent area is next to it."
aliases:
  - "Paliku Cabin"
fees:
  entry: 30
  note: "Cabin is $75 per night."
rules:
  - "Reach the cabin only on foot. Trails are steep with loose cinder."
  - "Up to 12 people per cabin. Bring sleeping bags, matches, food, and water treatment."
  - "Water nearby is not potable. Pit toilet nearby."
  - "No dogs or drones in the wilderness."
  - "Pack out everything. Stay on marked trails."
  - "Map pin is approximate."
  - "The Kaupō Gap Trail below Palikū leaves the park, crosses private ranch land, and is not maintained by NPS."
hazards:
  - "altitude"
  - "cold"
  - "mud"
  - "remote"
  - "steep_drop"
alerts:
