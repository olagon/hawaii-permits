id: "waihee-coastal-dunes-and-wetlands-refuge"
name: "Waiheʻe Coastal Dunes and Wetlands Refuge"
island: "maui"
land_type: "private_nonprofit"
manager: "hawaii-land-trust"
location:
  lat: 20.939
  lng: -156.506
activities:
  - "hiking"
