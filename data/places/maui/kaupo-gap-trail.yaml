summary: "The route from Palikū down Kaupō Gap to the coast leaves Haleakalā National Park and crosses private ranch land. NPS does not maintain it, calls it rugged, brushy, and unmaintained, and says hikers assume all risk. NPS recommends the Halemauʻu or Keoneheʻeheʻe trails instead."
