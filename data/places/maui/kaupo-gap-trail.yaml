  - "Frequent injuries reported. Do not attempt without a plan for a pickup at the bottom."
  - "No camping outside the park wilderness sites."
  - "Map pin is approximate."
hazards:
  - "steep_drop"
  - "heat"
  - "no_water"
  - "remote"
  - "mud"
