  entry: 0
  parking: 0
rules:
  - "Start at dawn. No shade or water on the trail."
  - "Two trailheads, Māʻalaea side and Ukumehame side. Arrange a pickup or hike back."
  - "Stay on the trail. Loose rock and steep drop offs."
  - "About 5.5 miles. Check the Nā Ala Hele trail page for current conditions and closures."
hazards:
  - "heat"
  - "no_water"
  - "steep_drop"
