status: "open"
summary: "Historic 1800s trail over the Kealaloloa ridge between Māʻalaea and Ukumehame, climbing about 1,600 feet through dry, rocky, open country with wide ocean views and whale watching in winter. Hot with no shade or water."
aliases:
  - "Lahaina Pali"
  - "Pali Trail"
