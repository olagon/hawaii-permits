summary: "Four sections (Honokōwai, Kahakuloa, Līhau, Panaewa) of steep West Maui rainforest and bog. There are no maintained public trails inside the reserve. Hunting unit A and the Waiheʻe Ridge Trail run near the Kahakuloa section boundary. Entry beyond the trail needs a DLNR permit."
